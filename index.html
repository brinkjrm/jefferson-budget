<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jefferson St · Budget</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg:         '#000000',
            card:       '#1c1c1e',
            card2:      '#2c2c2e',
            card3:      '#3a3a3c',
            sep:        'rgba(84,84,88,0.55)',
            lbl:        '#ffffff',
            lbl2:       '#8e8e93',
            lbl3:       '#636366',
            acc:        '#0a84ff',
            pos:        '#30d158',
            neg:        '#ff453a',
            warn:       '#ff9f0a',
            ylw:        '#ffd60a',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Helvetica Neue"', 'sans-serif'],
          },
          borderRadius: {
            apple: '12px',
            apple2: '16px',
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-font-smoothing: antialiased; }
    body { background-color: #000000; color: #ffffff; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid rgba(10, 132, 255, 0.45);
      outline-offset: 2px;
    }

    .row-locked  { background-color: rgba(48, 209, 88, 0.08); }
    .row-pending { background-color: transparent; }
    .row-overage { background-color: rgba(255, 69, 58, 0.10); }

    input, select, textarea {
      background-color: #3a3a3c !important;
      color: #ffffff !important;
      border-color: rgba(84,84,88,0.55) !important;
    }
    input::placeholder { color: #636366 !important; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1c1c1e; }
    ::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 3px; }

    .glass {
      background: rgba(28, 28, 30, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .tab-active {
      background: transparent;
      color: #0a84ff;
      border-radius: 0 !important;
      box-shadow: inset 0 -2px 0 #0a84ff;
    }

    .btn-primary {
      background: #0a84ff;
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-weight: 600;
      box-shadow: none;
      transition: opacity .15s, transform .15s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      background: transparent;
      color: #0a84ff;
      border: 0;
      border-radius: 8px;
      font-weight: 600;
      box-shadow: none;
      transition: background .15s, opacity .15s;
    }
    .btn-secondary:hover { background: rgba(10, 132, 255, 0.10); }
    .btn-secondary:active { opacity: 0.65; }
    .btn-secondary:disabled, .btn-primary:disabled { opacity: 0.38; }

    .icon-action {
      background: transparent;
      border: 0;
      border-radius: 50%;
      color: #0a84ff;
      transition: background .15s, opacity .15s;
    }
    .icon-action:hover { background: rgba(10, 132, 255, 0.10); }
    .icon-action:active { opacity: 0.6; }

    button.apple-card {
      border-color: transparent;
      box-shadow: none;
    }
    button.apple-card:hover { background: #242426; }

    .apple-card {
      background: #1c1c1e;
      border-radius: 16px;
      border: 1px solid rgba(84,84,88,0.35);
    }

    .apple-input {
      background: #2c2c2e !important;
      border: 1px solid rgba(84,84,88,0.55) !important;
      border-radius: 8px !important;
      color: #fff !important;
      padding: 6px 10px;
      font-size: 14px;
      transition: border-color .15s;
    }
    .apple-input:focus {
      outline: none !important;
      border-color: #0a84ff !important;
      background: #2c2c2e !important;
    }

    tr:hover td, .data-row:hover { background: rgba(255,255,255,0.04) !important; }

    .schedule-print { display: none; }

    @media print {
      @page { size: landscape; margin: 0.42in; }
      body { background: #fff !important; color: #111 !important; }
      body > #root > div > header,
      body > #root > div > main > :not(:has(.schedule-print)),
      body > #root > div > div,
      .schedule-screen,
      .no-print { display: none !important; }
      body > #root > div > main { max-width: none !important; padding: 0 !important; }
      .schedule-print { display: block !important; color: #111; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .schedule-print .print-header { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 2px solid #111; padding-bottom: 10px; margin-bottom: 9px; }
      .schedule-print h1 { margin: 0; font-size: 22px; line-height: 1.1; }
      .schedule-print .print-header p { margin: 4px 0 0; color: #444; font-size: 11px; }
      .schedule-print .print-dates { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 11px; }
      .schedule-print .print-dates span { color: #555; font-size: 9px; }
      .schedule-print .print-note { margin: 0 0 10px; padding: 7px 9px; background: #f2f3f5; border: 1px solid #d8dadd; border-radius: 4px; font-size: 8px; line-height: 1.35; }
      .schedule-print section { break-inside: auto; margin-bottom: 10px; }
      .schedule-print h2 { break-after: avoid; margin: 0 0 3px; padding: 4px 7px; border-left: 5px solid #0a84ff; background: #eceef1; font-size: 11px; line-height: 1.1; }
      .schedule-print table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 7px; line-height: 1.2; }
      .schedule-print thead { display: table-header-group; }
      .schedule-print tr { break-inside: avoid; }
      .schedule-print th { padding: 3px 4px; text-align: left; color: #444; background: #f7f7f7; border: 1px solid #cfd2d6; font-size: 6.5px; text-transform: uppercase; letter-spacing: .03em; }
      .schedule-print td { padding: 3px 4px; vertical-align: top; border: 1px solid #d8dadd; overflow-wrap: anywhere; }
      .schedule-print th:nth-child(1), .schedule-print td:nth-child(1) { width: 21%; }
      .schedule-print th:nth-child(2), .schedule-print td:nth-child(2) { width: 11%; }
      .schedule-print th:nth-child(3), .schedule-print td:nth-child(3),
      .schedule-print th:nth-child(4), .schedule-print td:nth-child(4) { width: 9%; white-space: nowrap; }
      .schedule-print th:nth-child(5), .schedule-print td:nth-child(5) { width: 4%; text-align: center; }
      .schedule-print th:nth-child(6), .schedule-print td:nth-child(6) { width: 29%; }
      .schedule-print th:nth-child(7), .schedule-print td:nth-child(7) { width: 17%; }
      .schedule-print .inspection-row td { background: #fff8e8; }
      .schedule-print .inspection-label { color: #9a5800; font-size: 6px; white-space: nowrap; }
      .schedule-print .print-footer { margin-top: 12px; padding-top: 5px; border-top: 1px solid #bbb; color: #666; text-align: right; font-size: 7px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
